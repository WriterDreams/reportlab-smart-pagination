[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportlab-smart-pagination"
version = "1.0.0"
description = "Height-aware heading protection for ReportLab PDF generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Hamdy El-Shamha", email = "support@writersdream.ai"},
]
keywords = ["reportlab", "pdf", "pagination", "headings", "typesetting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "reportlab>=3.6",
]

[project.urls]
Homepage = "https://github.com/WriterDreams/reportlab-smart-pagination"
Documentation = "https://github.com/WriterDreams/reportlab-smart-pagination#readme"
Issues = "https://github.com/WriterDreams/reportlab-smart-pagination/issues"
Source = "https://github.com/WriterDreams/reportlab-smart-pagination"
